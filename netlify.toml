# The pages in site/ are already built, so there is nothing to compile.
# Netlify installs package.json dependencies for the functions in netlify/functions.
[build]
  command = "echo 'Static site, no build step'"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
